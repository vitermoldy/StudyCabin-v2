<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-buttons="solid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyCabin: a forest-cabin study room with its own clock</title>
  <meta name="description" content="Study in a cabin in a forest clearing where one minute passes every second, the weather turns, five seasons change, deer, foxes and an owl pass by and someone lives through the day, with your own YouTube music.">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="theme-color" content="#171716">
  <meta property="og:type" content="website">
  <meta property="og:title" content="StudyCabin: a forest-cabin study room with its own clock">
  <meta property="og:description" content="A live cabin in a forest clearing: a day every 24 minutes, weather, five seasons, animals passing, a resident, a focus timer and your YouTube music.">
  <meta property="og:image" content="./share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!-- <link rel="canonical" href="https://YOUR-DOMAIN/">: add once the site has its domain -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/motion/motion.css">
  <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
</head>
<body>
  <!--
    taste-skill deal (plan line 2): kind software; palette from the owner's references through
    start.mjs brand (mist #e4e5e1, ink #171716, lamp amber #d9a05b); type Instrument Sans (third of
    the dealt pairings, nearest to the reference's neo-grotesk); radius sharp; buttons solid;
    mark: wordmark (no logo given); the hero is the live scene (data-enter="off", its own load
    motion); moment: the activity word blurring in as the resident starts something new.
    antislop: during (global preference), dial ENERGY 3 / RHYTHM 1 / MOTION 3. Reasons: DESIGN.md.
    v2: the same interface; the scene moves from the beach to a forest clearing in the forest
    colours of the owner's SongPlay scene, with a pond and animals passing (DESIGN.md, v2).
  -->
  <header class="top">
    <a class="skip-link" href="#dock">Skip to the controls</a>
    <button class="chip chip--round" id="scene-pause" type="button" aria-pressed="false" aria-label="Pause the scene">
      <svg aria-hidden="true"><use href="#i-pause"/></svg>
    </button>
    <button class="chip" id="open-music" type="button" aria-controls="panel-music" aria-expanded="false">
      <span class="chip__glyph" aria-hidden="true">↳</span><span class="chip__text" id="open-music-text">Add music</span>
    </button>
  </header>

  <main id="top">
    <section class="hero" data-enter aria-labelledby="hero-h">
      <canvas id="scene" aria-hidden="true"></canvas>
      <img class="poster" id="poster" src="./poster.jpg" alt="" width="1600" height="1000" fetchpriority="high" decoding="async">
      <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="wrap hero__words">
        <p class="big big--a" id="word-activity" data-ink="light">Coffee</p>
        <p class="big big--b" data-ink="light" aria-hidden="true">at</p>
        <p class="big big--c" id="word-time" data-ink="light"><span class="sr-only">at </span><time id="clock" datetime="07:42">07:42</time></p>
        <div class="story">
          <h1 class="story__title" id="hero-h">StudyCabin, a study room in a forest cabin</h1>
          <p class="story__line" id="story-line">Coffee on the deck. Fog in the trees, 14°.</p>
          <p class="story__meta" id="story-meta">Day 1 of spring · one minute every second</p>
          <div class="btn-row"><button class="btn btn--primary" id="hero-focus" type="button">Start focus</button></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="controls">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
